<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="z-grad" x1="30" y1="28" x2="90" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="inner-glow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#bg-grad)"/>
  <rect width="120" height="120" rx="24" fill="url(#inner-glow)"/>
  <!-- Z as single continuous outline: top bar, right side down with zigzag, bottom bar, left side up with zigzag -->
  <g filter="url(#shadow)">
    <path d="
      M 30,28 L 90,28 L 90,40
      L 70,40 L 55,53 L 67,53 L 40,80
      L 90,80 L 90,92 L 30,92 L 30,80
      L 50,80 L 65,67 L 53,67 L 80,40
      L 30,40 Z
    " fill="url(#z-grad)"/>
  </g>
</svg>
